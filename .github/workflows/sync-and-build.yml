#===============================================================================
# GitHub Actions：上游同步 + 按需构建并推送 Docker 镜像到 GHCR
#   放置位置：.github/workflows/sync-and-build.yml
#
#   - push（任意分支 / tag）：直接构建“被推送的那个提交”并推镜像（按分支名打 tag，latest 只在 main）
#   - schedule / workflow_dispatch：先同步上游，只有“真有上游新提交”时才构建 main
#
#   建议停用上游自带的 .github/workflows/sync.yml，避免两个同步任务重复
#===============================================================================

name: Upstream Sync & Build

on:
  push:
    branches: ['**']             # 推送任意分支都构建；只想 main 就写 [main]
    tags: ['v*']
  schedule:
    - cron: "0 0 * * *"          # 每天 00:00 UTC 同步上游
  workflow_dispatch:             # 支持手动触发
    inputs:
      force_build:
        description: '忽略“是否有更新”判断，强制构建一次'
        type: boolean
        default: false

permissions:
  contents: write                # sync 需要推代码
  packages: write                # 构建需要推 GHCR

env:
  # ---- 上游信息（改成你要跟踪的仓库）----
  UPSTREAM_OWNER: Toperlock
  UPSTREAM_REPO: sing-box-subscribe
  UPSTREAM_BRANCH: main
  # ---- 你的 fork ----
  TARGET_BRANCH: main
  # ---- 构建目标平台：amd64 必留；要 arm64 写 "linux/amd64,linux/arm64"（走 QEMU，慢）----
  PLATFORMS: linux/amd64

jobs:
  #--------------------------------------------------------------------------------
  # 1) 同步上游（仅在定时/手动时执行；push 时跳过）
  #--------------------------------------------------------------------------------
  sync:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' && github.event.repository.fork }}
    outputs:
      changed: ${{ steps.sync.outputs.has_new_commits }}   # true/false，传给 build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: ${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}
          upstream_sync_branch: ${{ env.UPSTREAM_BRANCH }}
          target_sync_branch: ${{ env.TARGET_BRANCH }}
          # 推荐：配置带 workflow 权限的 PAT（Secret 名 SYNC_PAT）；
          # 未配置时回退到 GITHUB_TOKEN（上游改 workflow 文件时会被 GitHub 拦，需手动 Sync fork）
          target_repo_token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "::error::同步失败：上游可能改动了 .github/workflows/*，GitHub 拦住了 token 推送。请手动 Sync Fork 一次，或配置 SYNC_PAT（带 Workflows: Read and write 权限）"
          exit 1

  #--------------------------------------------------------------------------------
  # 2) 构建并推送
  #    触发条件：push（构建被推送的提交）｜ 同步到上游新提交 ｜ 手动强制
  #--------------------------------------------------------------------------------
  build:
    name: Build & push to GHCR
    needs: sync
    if: ${{ always() && (github.event_name == 'push' || needs.sync.outputs.changed == 'true' || inputs.force_build == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}   # 构建“被推送的提交”，而不是写死的 main
          fetch-depth: 0

      - name: Compute image and tags
        id: vars
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"                       # GHCR 要求全小写
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BRANCH_TAG="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"       # 分支名里的 / 换成 -（Docker tag 不允许 /）
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$BRANCH_TAG"
            echo "$IMAGE:sha-$SHORT_SHA"
            if [ "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}" ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
