#===============================================================================
# GitHub Actions：上游同步 + 按需构建并推送 Docker 镜像到 GHCR
#   放置位置：你 fork 仓库的 .github/workflows/sync-and-build.yml
#   建议同时停用原仓库自带的 .github/workflows/sync.yml（避免两个同步任务打架）
#
#   逻辑：每天（或手动）先把上游合并进你的 main；
#         只有“真有新提交”时才构建镜像并推到 ghcr.io/<owner>/<repo>:latest
#===============================================================================

name: Upstream Sync & Build

on:
  schedule:
    - cron: "0 0 * * *"          # 每天 00:00 UTC 同步
  workflow_dispatch:             # 支持手动触发
    inputs:
      force_build:
        description: '忽略“是否有更新”判断，强制构建一次'
        type: boolean
        default: false

permissions:
  contents: write                # sync 需要推代码
  packages: write                # 构建需要推 GHCR

env:
  # ---- 上游信息（改成你要跟踪的仓库）----
  UPSTREAM_OWNER: Toperlock
  UPSTREAM_REPO: sing-box-subscribe
  UPSTREAM_BRANCH: main
  # ---- 你的 fork ----
  TARGET_BRANCH: main
  # ---- 构建目标平台：amd64 必留；要 arm64 写 "linux/amd64,linux/arm64"（走 QEMU，慢）----
  PLATFORMS: linux/amd64

jobs:
  #--------------------------------------------------------------------------------
  # 1) 同步上游
  #--------------------------------------------------------------------------------
  sync:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    outputs:
      changed: ${{ steps.sync.outputs.has_new_commits }}   # true/false，传给 build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: ${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}
          upstream_sync_branch: ${{ env.UPSTREAM_BRANCH }}
          target_sync_branch: ${{ env.TARGET_BRANCH }}
          # 推荐：配置带 workflow 权限的 PAT（Secret 名 SYNC_PAT）；
          # 未配置时回退到 GITHUB_TOKEN（上游改 workflow 文件时会被 GitHub 拦，需手动 Sync fork）
          target_repo_token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "::error::同步失败：上游可能改动了 .github/workflows/*，GitHub 拦住了 token 推送。请手动 Sync Fork 一次，或配置 SYNC_PAT（带 Workflows: Read and write 权限）"
          exit 1

  #--------------------------------------------------------------------------------
  # 2) 构建并推送（仅当真有新提交，或手动强制）
  #--------------------------------------------------------------------------------
  build:
    name: Build & push to GHCR
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || inputs.force_build == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest synced code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}   # 取同步后的最新 main（默认取的是触发时的旧 SHA）
          fetch-depth: 0

      - name: Resolve image name / tags
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"   # GHCR 要求全小写
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.image }}:date-${{ steps.vars.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
